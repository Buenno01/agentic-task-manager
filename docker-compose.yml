# O nome do projeto e os volumes abaixo NÃO devem mudar: scripts/atualizar.sh (ADR-0011) atualiza a produção
# reaproveitando-os, e o backup/rollback do banco lê/escreve o volume atm-db. O daemon não monta docker.sock.
name: agentic-task-manager

services:
  daemon:
    build: ./daemon
    restart: unless-stopped
    environment:
      ATM_HOST: 0.0.0.0
      ATM_PORT: "3000"
      ATM_DB_PATH: /data/db/atm.db
      ATM_ATTACHMENTS_DIR: /data/attachments
      ATM_HUMAN_TOKEN: ${ATM_HUMAN_TOKEN:?defina ATM_HUMAN_TOKEN no .env}
      ATM_AGENT_TOKENS: ${ATM_AGENT_TOKENS:?defina ATM_AGENT_TOKENS no .env, incluindo orquestrador:<token>}
      # O processo do agente alcança o MCP pela rede do Compose (ADR-0008).
      ATM_MCP_URL: http://mcp:3100/mcp
      ATM_WORKSPACES_DIR: /data/workspaces
      # Logs por Rodada (saída grande) em /data/logs/<rodada>/ (volume atm-logs).
      ATM_LOGS_DIR: /data/logs
      # Token do GitHub (escopo mínimo, ADR-0001): só Rodadas de Execução, via GIT_ASKPASS; nunca na URL do remote.
      ATM_GITHUB_TOKEN: ${ATM_GITHUB_TOKEN:-}
      ATM_MAX_RODADAS: ${ATM_MAX_RODADAS:-2}
      # Executor (ADR-0009): "hermes" liga o adaptador; vazio = não configurado. Chaves do provedor são repassadas só ao agente.
      ATM_EXECUTOR: ${ATM_EXECUTOR:-}
      ATM_HERMES_MODEL: ${ATM_HERMES_MODEL:-}
      ATM_HERMES_MAX_TURNS: ${ATM_HERMES_MAX_TURNS:-}
      ATM_HERMES_RUN_BUDGET: ${ATM_HERMES_RUN_BUDGET:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # Clones dos repositórios dos Contextos (volume atm-repos); os Workspaces são worktrees deles.
      ATM_REPOS_DIR: /data/repos
      # Origens CORS permitidas (separadas por vírgula); vazio = UI local em :5173.
      ATM_CORS_ORIGIN: ${ATM_CORS_ORIGIN:-}
      # Tag em execução: exportada por scripts/atualizar.sh; vazio fora do fluxo de atualização.
      ATM_VERSAO: ${ATM_VERSAO:-}
      # Diretório compartilhado com o host (marcador, pedido e resultado da atualização). O daemon só
      # grava o pedido; quem executa é a unit systemd --user do host. Sem marcador => "indisponível".
      ATM_RUN_DIR: /run/atm
    ports:
      - "127.0.0.1:${ATM_PORT:-3000}:3000"
    volumes:
      - atm-db:/data/db
      - atm-attachments:/data/attachments
      - atm-logs:/data/logs
      - atm-workspaces:/data/workspaces
      - atm-repos:/data/repos
      # ./run no host = ATM_ESTADO_DIR de scripts/atualizar.sh (padrão <clone>/run, o clone de produção).
      # Precisa ser gravável pelo uid 1000 (usuário node do container). Docker cria o diretório se faltar.
      - ./run:/run/atm
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # MCP para agentes: cliente fino da API do daemon. Usa só o token do agente (nunca o do humano).
  # Streamable HTTP em http://127.0.0.1:${ATM_MCP_PORT:-3100}/mcp (bearer = ATM_AGENT_TOKEN).
  # Alternativa stdio: docker compose run --rm -i -e ATM_MCP_TRANSPORT=stdio mcp
  mcp:
    build: ./mcp
    restart: unless-stopped
    depends_on:
      daemon:
        condition: service_healthy
    environment:
      ATM_API_URL: http://daemon:3000
      ATM_MCP_HOST: 0.0.0.0
      ATM_MCP_PORT: "3100"
      ATM_AGENT_TOKEN: ${ATM_AGENT_TOKEN:?defina ATM_AGENT_TOKEN no .env (o mesmo token de um agente em ATM_AGENT_TOKENS)}
    ports:
      - "127.0.0.1:${ATM_MCP_PORT:-3100}:3100"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # MCP do assistente pessoal: opera TUDO em nome do humano (usa ATM_HUMAN_TOKEN para falar com a API).
  # Streamable HTTP em http://127.0.0.1:${ATM_ASSISTANT_MCP_PORT:-3101}/mcp; bearer do cliente = ATM_ASSISTANT_MCP_TOKEN
  # (se vazio, o próprio ATM_HUMAN_TOKEN). Aprovar plano/forçar início/converter ficam FORA, salvo ATM_MCP_PERMITIR_APROVACAO=1.
  mcp-assistente:
    build: ./mcp
    restart: unless-stopped
    depends_on:
      daemon:
        condition: service_healthy
    environment:
      ATM_MCP_PERFIL: assistente
      ATM_API_URL: http://daemon:3000
      ATM_MCP_HOST: 0.0.0.0
      ATM_MCP_PORT: "3100"
      ATM_HUMAN_TOKEN: ${ATM_HUMAN_TOKEN:?defina ATM_HUMAN_TOKEN no .env}
      ATM_ASSISTANT_MCP_TOKEN: ${ATM_ASSISTANT_MCP_TOKEN:-}
      ATM_MCP_PERMITIR_APROVACAO: ${ATM_MCP_PERMITIR_APROVACAO:-0}
    ports:
      - "127.0.0.1:${ATM_ASSISTANT_MCP_PORT:-3101}:3100"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  ui:
    build: ./ui
    restart: unless-stopped
    depends_on:
      daemon:
        condition: service_healthy
    environment:
      UI_HOST: 0.0.0.0
      UI_PORT: "5173"
      ATM_API_URL: http://daemon:3000
    ports:
      - "127.0.0.1:${UI_PORT:-5173}:5173"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10

# atm-db é copiado por scripts/atualizar.sh antes de cada atualização (ADR-0011); os demais não entram no backup.
volumes:
  atm-db:
  atm-attachments:
  atm-logs:
  atm-workspaces:
  atm-repos:
