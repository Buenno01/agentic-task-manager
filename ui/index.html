<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Agentic Task Manager</title>
  </head>
  <body>
    <form id="token-form">
      <input name="token" type="password" placeholder="Token" autocomplete="off" />
      <button>Salvar token</button>
    </form>
    <h1>Contextos</h1>
    <form id="novo-contexto">
      <input name="name" placeholder="Nome" required />
      <select name="kind">
        <option>cliente</option><option>projeto</option><option>repositorio</option><option>loja</option><option>ambiente</option>
      </select>
      <select name="parentId" id="pai"></select>
      <input name="repository" placeholder="Repositório" />
      <input name="testCommands" placeholder="Comandos de teste (um por linha: separe por ;)" />
      <input name="concurrencyLimit" type="number" min="1" placeholder="Limite de concorrência" />
      <input name="instructions" placeholder="Instruções" />
      <button>Criar Contexto</button>
    </form>
    <ul id="arvore"></ul>
    <pre id="resolvido"></pre>
    <h1>Tarefas</h1>
    <form id="nova">
      <input name="title" placeholder="Título" required />
      <input name="description" placeholder="Descrição" />
      <select name="contextId" id="ctx-tarefa"></select>
      <button>Criar Tarefa</button>
    </form>
    <p id="erro" role="alert"></p>
    <button type="button" id="inbox">Aguardando humano (0)</button>
    <select id="filtro-estado">
      <option value="">(todos os estados)</option>
      <option>Novo</option><option>Autorizada para explorar</option><option>Explorando</option>
      <option>Aguardando humano</option><option>Plano pronto para aprovação</option><option>Aprovado</option><option>Rejeitado</option>
    </select>
    <select id="filtro-ctx"></select>
    <ul id="lista"></ul>
    <section id="historico" hidden>
      <h2 id="historico-titulo"></h2>
      <ul id="historico-linha"></ul>
      <form id="comentario-form">
        <select name="tipo"><option>comentario</option><option>pergunta</option><option>resposta</option></select>
        <select name="respondeA"></select>
        <input name="texto" placeholder="Comentário" required />
        <button>Comentar</button>
      </form>
      <p id="historico-erro" role="alert"></p>
    </section>
    <script type="module" src="app.js"></script>
    <script type="module" src="historico.js"></script>
  </body>
</html>
